<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebPage</title>
</head>
<body>
    <div>
        <header>Header</header>
    </div>
    <div>
        Add Note
        <br>
        Select Chain
        <img src="" alt="">
    </div>
    <div class="card">
    <h3>Select Environment</h3>
    <div class="options">
      <label><input type="radio" name="env" /> Dev Net</label>
      <label><input type="radio" name="env" /> Test Net</label>
      <label><input type="radio" name="env" checked /> Main Net</label>
    </div>

    <h3>Select Server Type</h3>
    <div class="options">
      <label><input type="radio" name="server" /> Small</label>
      <label><input type="radio" name="server" /> Medium</label>
      <label><input type="radio" name="server" checked /> Large</label>
    </div>

    <h3>Select Number of Months</h3>
    <div class="options">
      <label><input type="radio" name="months" /> 01</label>
      <label><input type="radio" name="months" checked /> 03</label>
      <label><input type="radio" name="months" /> 06</label>
      <label><input type="radio" name="months" /> 12</label>
    </div>

    <h3>Blockpi Api</h3>
    <input type="text" placeholder="Enter blockpi api" />

    <div class="price-box">
      <strong>Price:</strong>
      <span>₹ 5,999</span>
    </div>
</body>
</html>
