<body class="bg-light text-dark">

    <div class="container text-center p-5">

        <h1 class="fw-bold mt-4">Astha Goswami</h1>
        <p class="mb-3">Web Developer • Designer • Learner</p>

   
        <img src="profile.jpg"
             class="img-fluid rounded-circle mb-4"
             alt="Profile Image">

        <div class="mb-4">
            <button class="btn btn-primary me-2">Hire Me</button>
            <button class="btn btn-dark">Download CV</button>
        </div>
        <form class="mx-auto" style="max-width: 400px;">
            <input type="text" class="form-control mb-3" placeholder="Your Name">
            <input type="email" class="form-control mb-3" placeholder="Your Email">
            <textarea class="form-control mb-3" placeholder="Your Message" rows="3"></textarea>

            <button class="btn btn-success w-100">Send Message</button>
        </form>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
