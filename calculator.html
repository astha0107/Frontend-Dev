<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <div class="outer-box">
        <div id="internal-box">0</div>
        
        <button class="yellow">AC</button>
        <button class="yellow">+</button>
        <button class="yellow">%</button>
        <button class="yellow">&divide</button>

        <button class="light-blue">7</button>
        <button class="light-blue">8</button>
        <button class="light-blue">9</button>
        <button class="yellow">*</button>

        <button class="light-blue">4</button>
        <button class="light-blue">5</button>
        <button class="light-blue">6</button>
        <button class="yellow">-</button>

        <button class="light-blue">1</button>
        <button class="light-blue">2</button>
        <button class="light-blue">3</button>
        <button class="yellow">+</button>



    </div>
</body>
</html>
